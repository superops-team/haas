# coworker config — copy to one of:
#   ~/.config/coworker/config.toml          (global)
#   <your-project>/.coworker/config.toml    (per-workspace, overrides global)
#
# All keys are optional; unset keys fall back to built-in defaults.

model = "gpt-5.5"            # default model id (override per session in the UI/CLI)
mode = "interactive"         # plan | interactive | auto | custom
max_iterations = 12          # max model<->tool iterations per turn before stopping

# Commands auto-allowed without an approval prompt (prefix match).
allowed_commands = [
  "ls", "cat", "pwd", "grep", "find",
  "git status", "git diff", "git log",
  "python3", "pytest", "node", "npm",
]

# In "custom" permission mode, these tools are auto-approved (everything else still
# asks). e.g. auto-accept file edits but keep asking before running shell commands.
auto_allow = ["write_file", "replace_in_file", "apply_patch", "apply_unified_diff"]

# Server (openworker-server) bind address.
host = "127.0.0.1"
port = 8765

# HaaS delegated execution backend. This namespace is global-only: workspace
# config files must not enable or relax remote/container execution.
[haas_delegation]
enabled = false
base_url = "http://127.0.0.1:8092"
user_id = "manager"
harness_id = "chrn_codex_default"
harness_base = "codex"
image = "haas:local"
image_digest = ""
allow_unpinned_local_image = false
strategy = "deterministic"
local_autostart = false
require_trusted_workspace = true
agent_allowlist = ["code"]
trigger_keywords = ["fix", "implement", "modify", "edit", "add", "update", "refactor", "debug", "test"]
idle_ttl_seconds = 1800
max_container_lifetime_seconds = 28800
request_timeout_seconds = 30

# Equivalent startup environment switches:
#   COWORKER_HAAS_DELEGATION_ENABLED=1
#   COWORKER_HAAS_LOCAL_AUTOSTART=1
#   COWORKER_HAAS_BASE_URL=http://127.0.0.1:8092
#   COWORKER_HAAS_API_TOKEN=...
#   COWORKER_HAAS_IMAGE=haas:local
#   COWORKER_HAAS_IMAGE_DIGEST=sha256:...
#   COWORKER_HAAS_ALLOW_UNPINNED_LOCAL_IMAGE=1
