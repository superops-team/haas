[project]
name = "haas"
version = "0.1.0"
description = "Harness As A Service (HaaS) sidecar control plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "websockets>=15.0.0,<16.0.0",
  "httpx>=0.27",
  # multipart upload for POST /v1/haas/files (specs/artifact-store §5.1)
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "coverage>=7.5",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a running HaaS + harness (off by default)",
  "e2e: requires HAAS_E2E=1 explicit environment switches (off by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["haas"]

[tool.coverage.run]
branch = true
source = ["haas"]

[tool.coverage.report]
show_missing = true
