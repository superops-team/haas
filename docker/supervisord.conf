; HaaS optional process manager config (specs/container-runtime §5.2).
; Readiness must be derived from real probes, not supervisor RUNNING state.
[supervisord]
nodaemon=true

[program:aio]
command=/opt/gem/run.sh
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sidecar]
command=/app/haas/.venv/bin/uvicorn haas.config:create_app --factory --host 0.0.0.0 --port 8092
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:codex]
command=codex app-server --listen unix:///tmp/haas/codex.sock
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
