        toolCallId: {type: string}
        toolName: {type: string}
        safeSummary: {type: string}
        activityKind: {$ref: "#/components/schemas/ToolActivityKind"}
        commandPreview: {$ref: "#/components/schemas/CommandPreview"}
        workingDirectory: {$ref: "#/components/schemas/WorkingDirectoryHint"}
        evidenceRef: {$ref: "#/components/schemas/EvidenceRef"}
        evidenceExpiresAtMs: {$ref: "#/components/schemas/EvidenceExpiresAtMs"}
        modelCallId: {$ref: "#/components/schemas/ModelCallId"}
      additionalProperties: false
    ToolOutputEventMetadata:
      type: object
      required: [toolCallId, toolName, safeSummary]
      properties:
        toolCallId: {type: string}
        toolName: {type: string}
        safeSummary: {type: string}
        activityKind: {$ref: "#/components/schemas/ToolActivityKind"}
        outputPreview: {$ref: "#/components/schemas/ToolOutputPreview"}
        omittedLineCount: {type: integer, minimum: 0}
        commandPreview: {$ref: "#/components/schemas/CommandPreview"}
        workingDirectory: {$ref: "#/components/schemas/WorkingDirectoryHint"}
        evidenceRef: {$ref: "#/components/schemas/EvidenceRef"}
        evidenceExpiresAtMs: {$ref: "#/components/schemas/EvidenceExpiresAtMs"}
        modelCallId: {$ref: "#/components/schemas/ModelCallId"}
      additionalProperties: false
    ToolCompletedEventMetadata:
      type: object
      required: [toolCallId, toolName, status]
      properties:
        toolCallId: {type: string}
        toolName: {type: string}
        status: {type: string, const: completed}
        activityKind: {$ref: "#/components/schemas/ToolActivityKind"}
        durationMs: {type: integer, minimum: 0}
        exitCode: {type: integer}
        outputPreview: {$ref: "#/components/schemas/ToolOutputPreview"}
        omittedLineCount: {type: integer, minimum: 0}
        commandPreview: {$ref: "#/components/schemas/CommandPreview"}
        workingDirectory: {$ref: "#/components/schemas/WorkingDirectoryHint"}
        evidenceRef: {$ref: "#/components/schemas/EvidenceRef"}
        evidenceExpiresAtMs: {$ref: "#/components/schemas/EvidenceExpiresAtMs"}
        modelCallId: {$ref: "#/components/schemas/ModelCallId"}
      additionalProperties: false
    ToolFailedEventMetadata:
      type: object
      required: [toolCallId, toolName, status, safeReason, retryable]
      properties:
        toolCallId: {type: string}
        toolName: {type: string}
        status: {type: string, const: failed}
        code: {type: string}
        safeReason: {type: string}
        retryable: {type: boolean}
        activityKind: {$ref: "#/components/schemas/ToolActivityKind"}
        durationMs: {type: integer, minimum: 0}
        exitCode: {type: integer}
        outputPreview: {$ref: "#/components/schemas/ToolOutputPreview"}
        omittedLineCount: {type: integer, minimum: 0}
        commandPreview: {$ref: "#/components/schemas/CommandPreview"}
        workingDirectory: {$ref: "#/components/schemas/WorkingDirectoryHint"}
        evidenceRef: {$ref: "#/components/schemas/EvidenceRef"}
        evidenceExpiresAtMs: {$ref: "#/components/schemas/EvidenceExpiresAtMs"}
        modelCallId: {$ref: "#/components/schemas/ModelCallId"}
      additionalProperties: false
    ToolActivityKind:
      type: string
      enum: [command, read, search, edit, tool]
      description: Presentation-neutral semantic class observed by the adapter or policy catalog. Unknown operations use tool.
    ToolOutputPreview:
      type: string
      maxLength: 4096
      x-haas-max-utf8-bytes: 4096
      x-haas-max-logical-lines: 20
      description: Bounded redacted preview. Runtime enforcement uses the HaaS byte and logical-line limits because JSON Schema maxLength counts characters. Complete output requires a separately authorized artifact.
    CommandPreview:
      type: string
      maxLength: 512
      description: One-line bounded command summary with credential values and signed URL material redacted for durable event use.
    WorkingDirectoryHint:
      type: string
      maxLength: 512
      description: Container-relative or otherwise non-host-sensitive working-directory hint. Absolute host paths are prohibited.
    EvidenceRef:
      type: string
      pattern: "^evd_"
      description: Opaque locator for scoped in-memory evidence; never evidence content.
    EvidenceExpiresAtMs:
      type: integer
      minimum: 0
      description: Epoch-millisecond upper bound after which the evidence locator is unusable.
    ExecutionEvidenceLink:
      type: object
      required: [url, kind, expiresAtMs]
      properties:
        url:
          type: string
          format: uri
          description: Complete display URL. Validated authorization URLs retain their signature byte-for-byte until expiry.
        kind:
          type: string
          enum: [ordinary, authorization]
        expiresAtMs:
          type: [integer, "null"]
          minimum: 0
      additionalProperties: false
    ExecutionEvidence:
      type: object
      required: [evidenceRef, sessionId, invocationId, toolCallId, command, workingDirectory, output, outputStream, links, expiresAtMs]
      properties:
        evidenceRef: {$ref: "#/components/schemas/EvidenceRef"}
        sessionId: {type: string}
        invocationId: {type: string, pattern: "^inv_"}
        toolCallId: {type: string}
        command:
          type: string
          description: Actual command with credential values masked; validated authorization URLs may remain intact.
        workingDirectory:
          type: string
          description: Actual container working directory; absolute host paths are prohibited.
        output:
          type: string
          maxLength: 8388608
          x-haas-max-utf8-bytes: 8388608
          description: Command output, complete through the 8 MiB bound, with credential values masked. Larger output is explicitly truncated.
        outputStream:
          type: string
          enum: [combined, stdout, stderr]
          description: combined unless the adapter has authoritative stream identity.
        links:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/ExecutionEvidenceLink"
        expiresAtMs: {$ref: "#/components/schemas/EvidenceExpiresAtMs"}
      additionalProperties: false
