openapi: 3.1.0
info:
  title: Harness As A Service Protocol (ADK 2.0)
  version: "2026-09-10"
  summary: ADK 2.0-compatible protocol surface for HaaS.
  description: |
    HaaS exposes the Google ADK 2.0 REST API protocol layer as its northbound contract,
    plus HaaS-native control-plane extensions.
    Prose in README.md is normative when behavior cannot be expressed in OpenAPI.
servers:
  - url: http://127.0.0.1:8092
    description: Local HaaS sidecar
security:
  - bearerAuth: []
tags:
  - name: Discovery
  - name: Execution
  - name: Sessions
  - name: HaaS
paths:
  /health:
    get:
      tags: [HaaS]
      operationId: getHealthAlias
      summary: Container liveness alias for HaaS health
      security: []
      responses:
        "200":
          description: Health snapshot
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaasEnvelope"
  /ready:
    get:
      tags: [HaaS]
      operationId: getReadyAlias
      summary: Container readiness alias for HaaS readiness
      security: []
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [control, execution, capability]
            default: execution
      responses:
        "200":
          description: Ready snapshot
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaasEnvelope"
  /list-apps:
    get:
      tags: [Discovery]
      operationId: listApps
      summary: List configured harness app names in caller scope
      responses:
        "200":
          description: Array of app names (harness ids)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /run:
    post:
      tags: [Execution]
      operationId: runAgent
      summary: Run a harness and return all events in one JSON array
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: |
            HTTP 200 ADK Event array for every accepted invocation terminal outcome,
            including completed, failed, incomplete, interrupted, and cancelled. Pre-acceptance
            failures use the structured 4xx/5xx responses below.
          headers:
            Idempotency-Expires-At:
              $ref: "#/components/headers/IdempotencyExpiresAt"
            X-HaaS-Invocation-ID:
              $ref: "#/components/headers/HaaSInvocationId"
            X-HaaS-Session-ID:
              $ref: "#/components/headers/HaaSSessionId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: Confirmed execution idempotency replay expiry; no execution is started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: Pre-acceptance adapter/provider preflight failure; no invocation exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "503":
          description: Pre-acceptance service failure, or post-acceptance terminal-event integrity failure with haasError.accepted=true and invocationId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
  /run_sse:
    post:
      tags: [Execution]
      operationId: runAgentSse
      summary: Run a harness and stream events over SSE
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceId"
        - $ref: "#/components/parameters/LastEventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: |
            HTTP 200 SSE stream for every accepted invocation. After acceptance,
            failed/incomplete/interrupted/cancelled outcomes are terminal ADK events followed by
            stream closure; they do not change the HTTP status.
          headers:
            Idempotency-Expires-At:
              $ref: "#/components/headers/IdempotencyExpiresAt"
            X-HaaS-Invocation-ID:
              $ref: "#/components/headers/HaaSInvocationId"
            X-HaaS-Session-ID:
              $ref: "#/components/headers/HaaSSessionId"
            Cache-Control:
              schema:
                type: string
                const: no-cache
          content:
            text/event-stream:
              schema:
                type: string
              x-haas-event-schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: Confirmed execution idempotency replay or event-cursor expiry; no execution is started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: Pre-acceptance adapter/provider preflight failure before SSE headers; no invocation exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "503":
          description: Pre-acceptance service failure, or post-acceptance terminal-event integrity failure before SSE headers with haasError.accepted=true and invocationId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
  /apps/{app_name}/users/{user_id}/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/AppName"
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Get one session with state and events
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: ADK session read exceeds the bounded response budget; use the native events-page API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
    patch:
      tags: [Sessions]
      operationId: updateSession
      summary: Update session state via stateDelta
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stateDelta]
              properties:
                stateDelta:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Sessions]
      operationId: deleteSession
      summary: Delete a session and its data
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/haas/health:
    get:
      tags: [HaaS]
      operationId: getHaasHealth
      summary: HaaS process liveness
      security: []
      responses:
        "200":
          description: Health snapshot
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaasEnvelope"
  /v1/haas/ready:
    get:
      tags: [HaaS]
      operationId: getHaasReady
      summary: HaaS readiness by scope
      security: []
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [control, execution, capability]
            default: execution
      responses:
        "200":
          description: Ready snapshot
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaasEnvelope"
  /v1/haas/status:
    get:
      tags: [HaaS]
      operationId: getHaasStatus
      summary: HaaS diagnostic status
      responses:
        "200":
          description: Status snapshot
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaasEnvelope"
  /v1/haas/capabilities:
    get:
      tags: [HaaS]
      operationId: getHaasCapabilities
      summary: Discover caller-visible HaaS and harness capabilities
      description: |
        Stable pre-session capability discovery. Unknown feature keys or enum values
        must be treated as unsupported by clients. Runtime diagnostics remain on
        /v1/haas/status and /v1/haas/diagnostics.
      responses:
        "200":
          description: Caller-scoped capability snapshot
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesEnvelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/haas/diagnostics:
    get:
      tags: [HaaS]
      operationId: getHaasDiagnostics
      summary: Redacted HaaS diagnostics
      responses:
        "200":
          description: Diagnostic snapshot
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaasEnvelope"
  /v1/haas/harnesses:
    get:
      tags: [HaaS]
      operationId: listHaasHarnesses
      summary: List configured harnesses with details
      responses:
        "200":
          description: Harness list wrapped in the HaaS envelope (`data.harnesses`).
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessListEnvelope"
    post:
      tags: [HaaS]
      operationId: createHarness
      summary: Create a configured harness
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarnessCreate"
      responses:
        "200":
          description: Created harness (`data` = Harness)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessEnvelope"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/haas/harnesses/{harness_id}:
    parameters:
      - $ref: "#/components/parameters/HarnessId"
    get:
      tags: [HaaS]
      operationId: getHaasHarness
      summary: Get one configured harness
      responses:
        "200":
          description: Harness (`data` = Harness)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [HaaS]
      operationId: updateHarness
      summary: Update a configured harness
      description: The fields `id`, `base`, and `createdAtMs` are immutable.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarnessCreate"
      responses:
        "200":
          description: Updated harness (`data` = Harness)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [HaaS]
      operationId: deleteHarness
      summary: Delete a configured harness
      description: Deleting a harness does not delete historical sessions.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: Deleted
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/haas/harnesses/{harness_id}/skills/{skill_id}/files:
    parameters:
      - $ref: "#/components/parameters/HarnessId"
      - $ref: "#/components/parameters/SkillId"
    get:
      tags: [HaaS]
      operationId: listHarnessSkillFiles
      summary: List files in one configured skill bundle
      responses:
        "200":
          description: Skill files (`data` = {id, name, files})
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillFilesEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/haas/profiles:
    get:
      tags: [HaaS]
      operationId: listHarnessProfiles
      summary: List versioned harness profiles
      parameters:
        - name: harnessId
          in: query
          schema:
            type: string
            pattern: "^chrn_"
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, retired]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Profile page (`data` = array of HarnessProfile, `nextCursor` for pagination)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileListEnvelope"
    post:
      tags: [HaaS]
      operationId: createHarnessProfile
      summary: Create a draft harness profile revision
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarnessProfileCreate"
      responses:
        "200":
          description: Created profile (`data` = HarnessProfile)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/haas/profiles/{profile_id}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      tags: [HaaS]
      operationId: getHarnessProfile
      summary: Get one harness profile revision
      responses:
        "200":
          description: Profile (`data` = HarnessProfile)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [HaaS]
      operationId: updateHarnessProfile
      summary: Update a draft harness profile revision
      description: Only draft revisions are editable; active and retired revisions are immutable.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarnessProfileCreate"
      responses:
        "200":
          description: Updated draft profile (`data` = HarnessProfile)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/haas/profiles/{profile_id}/validate:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      tags: [HaaS]
      operationId: validateHarnessProfile
      summary: Validate a harness profile revision without side effects
      responses:
        "200":
          description: Validation result (`data` = ProfileValidation)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileValidationEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/haas/profiles/{profile_id}/activate:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      tags: [HaaS]
      operationId: activateHarnessProfile
      summary: Activate a validated harness profile revision
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: Activated profile (`data` = HarnessProfile)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/haas/models:
    get:
      tags: [HaaS]
      operationId: listModels
      summary: List models by harness backend
      responses:
        "200":
          description: Model catalog (`data` = ModelCatalog)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCatalogEnvelope"
  /v1/haas/delegated-sessions:
    post:
      tags: [HaaS]
      operationId: createDelegatedSession
      summary: Create or reuse a prepared manager-owned delegated-session candidate
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelegatedSessionCreate"
      responses:
        "200":
          description: Delegated session contract (`data` = DelegatedSessionContract)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegatedSessionEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/haas/delegated-sessions/{delegated_session_id}:
    parameters:
      - $ref: "#/components/parameters/DelegatedSessionId"
    get:
      tags: [HaaS]
      operationId: getDelegatedSession
      summary: Get one delegated session contract and runtime status
      responses:
        "200":
          description: Delegated session contract (`data` = DelegatedSessionContract)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegatedSessionEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/haas/delegated-sessions/{delegated_session_id}/restore:
    parameters:
      - $ref: "#/components/parameters/DelegatedSessionId"
    post:
      tags: [HaaS]
      operationId: restoreDelegatedSession
      summary: Restore runtime resources for a delegated session
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelegatedSessionRestore"
      responses:
        "200":
          description: Delegated session contract after restore (`data` = DelegatedSessionContract)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegatedSessionEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/haas/delegated-sessions/{delegated_session_id}/policy:
    parameters:
      - $ref: "#/components/parameters/DelegatedSessionId"
    post:
      tags: [HaaS]
      operationId: updateDelegatedSessionPolicy
      summary: Explicitly update or rebind a delegated session policy snapshot
      description: |
        In-place complete-domain update for delegationPolicySnapshot,
        mountManifest, profileRef and/or image. The same delegated session and
        manager chat binding are retained. A validated desired revision is
        persisted and reconciled independently of later turns; current accepted
        work is unchanged. Runtime verification advances appliedRevision. A
        failed application records a failed result and gates future turns.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelegatedSessionPolicyUpdate"
      responses:
        "200":
          description: Delegated session contract after policy update (`data` = DelegatedSessionContract)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegatedSessionEnvelope"
        "202":
          description: |
            Validated desired revision accepted for asynchronous reconciliation.
            Current work is unchanged; future turns wait for appliedRevision.
            Response includes a non-null pendingPolicyUpdate.
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegatedSessionEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/haas/sessions:
    get:
      tags: [HaaS]
      operationId: listHaasSessions
      summary: List sessions across users (admin view)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
        - name: app
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Session page (`data` = array of Session, `nextCursor` for pagination)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListEnvelope"
  /v1/haas/sessions/{session_id}/invocations/{invocation_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/InvocationId"
    get:
      tags: [HaaS]
      operationId: getHaasInvocation
      summary: Read authoritative invocation status for recovery
      responses:
        "200":
          description: Invocation (`data` = Invocation)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/haas/sessions/{session_id}/approvals:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [HaaS]
      operationId: listHaasApprovals
      summary: List caller-visible approval records for recovery
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [waiting, approved, denied, expired, cancelled]
            default: waiting
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Approval page
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalListEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/haas/sessions/{session_id}/input-requests:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [HaaS]
      operationId: listHaasInputRequests
      summary: List caller-visible structured input requests for recovery
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [waiting, answered, expired, cancelled]
            default: waiting
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Structured input request page
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InputRequestListEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/haas/sessions/{session_id}/events-page:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [HaaS]
      operationId: listHaasSessionEventsPage
      summary: Read a bounded page of canonical HaaS events
      parameters:
        - $ref: "#/components/parameters/AfterEventId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Canonical event page ordered by eventId
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalEventPageEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Cursor expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
  /v1/haas/sessions/{session_id}/events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [HaaS]
      operationId: streamHaasSessionEvents
      summary: Stream canonical HaaS session events with replay
      parameters:
        - $ref: "#/components/parameters/AfterEventId"
      responses:
        "200":
          description: SSE stream
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            text/event-stream:
              schema:
                type: string
              x-haas-event-schema:
                $ref: "#/components/schemas/CanonicalHaasEvent"
  /v1/haas/sessions/{session_id}/invocations/{invocation_id}/events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/InvocationId"
    get:
      tags: [HaaS]
      operationId: streamHaasInvocationEvents
      summary: Stream canonical HaaS invocation events with replay
      parameters:
        - $ref: "#/components/parameters/AfterEventId"
      responses:
        "200":
          description: SSE stream
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            text/event-stream:
              schema:
                type: string
              x-haas-event-schema:
                $ref: "#/components/schemas/CanonicalHaasEvent"
  /v1/haas/sessions/{session_id}/invocations/{invocation_id}/tools/{tool_call_id}/evidence:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/InvocationId"
      - $ref: "#/components/parameters/ToolCallId"
    get:
      tags: [HaaS]
      operationId: getExecutionEvidence
      summary: Read scoped short-lived command evidence
      description: |
        Display-only lookup of one in-memory command-evidence record. The bearer
        principal, complete session scope, invocation, tool call, and evidence_ref
        must all match. The response is never durable or cacheable. Ordinary URLs
        and validated unexpired authorization URLs remain usable; credential values
        remain masked.
      parameters:
        - name: evidence_ref
          in: query
          required: true
          schema:
            type: string
            pattern: "^evd_"
      responses:
        "200":
          description: Current execution evidence (`data` = ExecutionEvidence)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionEvidenceEnvelope"
        "404":
          description: Evidence absent, unavailable, or outside caller scope
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "410":
          description: Matching evidence has expired
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
  /v1/haas/sessions/{session_id}/invocations/{invocation_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/InvocationId"
    post:
      tags: [HaaS]
      operationId: cancelInvocation
      summary: Cancel a running invocation (idempotent)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: Current invocation state (`data` = Invocation)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/haas/sessions/{session_id}/invocations/{invocation_id}/pause:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/InvocationId"
    post:
      tags: [HaaS]
      operationId: pauseInvocation
      summary: Pause a running invocation after its interrupted terminal is observed
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: Authoritative interrupted invocation (`data` = Invocation)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/haas/sessions/{session_id}/invocations/{invocation_id}/continue:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/InvocationId"
    post:
      tags: [HaaS]
      operationId: continueInvocation
      summary: Continue an interrupted invocation as a new linked invocation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContinueInvocationRequest"
      responses:
        "200":
          description: ADK Event SSE projection for the new linked invocation
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
            X-HaaS-Invocation-ID:
              $ref: "#/components/headers/HaaSInvocationId"
            X-HaaS-Session-ID:
              $ref: "#/components/headers/HaaSSessionId"
          content:
            text/event-stream:
              schema:
                type: string
              x-haas-event-schema:
                $ref: "#/components/schemas/Event"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/haas/sessions/{session_id}/profile:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [HaaS]
      operationId: getSessionProfileRecoveryRef
      summary: Read the authoritative applied profile reference for recovery
      description: |
        Native control-plane recovery read for one non-delegated session. The
        response contains only the applied profile reference and a
        credential-free execution-intent fingerprint. It never exposes the
        effective profile snapshot, provider URLs, credential references, MCP
        headers, skill bytes, or policy bodies, and it does not change the ADK
        Session schema. A missing, ambiguous, or out-of-scope session returns
        404 session_not_found. A manager-delegated session returns 409
        haas_profile_rebind_unsupported and must use its delegated policy
        contract instead.
      responses:
        "200":
          description: Authoritative recovery-safe profile reference
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionProfileRecoveryEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/haas/sessions/{session_id}/profile-rebind:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [HaaS]
      operationId: rebindSessionProfile
      summary: Explicitly rebind future invocations in an existing session to a profile snapshot
      description: |
        Applies to non-delegated sessions only. A manager-delegated session
        (carrying delegatedSessionRef) returns 409 haas_profile_rebind_unsupported;
        its runtime configuration is owned by the manager-authorized mount manifest
        and delegation policy snapshot and is changed only through
        /v1/haas/delegated-sessions/{delegated_session_id}/policy.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileRebindRequest"
      responses:
        "200":
          description: Session profile snapshot after rebind (`data` = EffectiveHarnessProfile)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveProfileEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/haas/sessions/{session_id}/policy:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [HaaS]
      operationId: updateSessionPolicy
      summary: Stage a revisioned policy update for future invocations
      description: |
        Updates one or more complete workspace, network, or tools policy domains.
        The expected revision is compared with the current desired revision. An
        accepted/running invocation remains frozen on its applied revision; new
        invocations wait until the desired revision is applied and verified. A
        failed application retains the previous applied snapshot and gates new
        work. This operation never grants an action-scoped approval and never
        bypasses platform hard denies.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Required mutation key. Replaying the same key and request returns the original result.
          schema:
            type: string
            maxLength: 255
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionPolicyUpdateRequest"
      responses:
        "200":
          description: Policy revision applied synchronously (`data` = SessionPolicyRevision)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPolicyRevisionEnvelope"
        "202":
          description: Desired revision persisted and pending runtime reconciliation
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPolicyRevisionEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/haas/sessions/{session_id}/approvals/{approval_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/ApprovalId"
    post:
      tags: [HaaS]
      operationId: resolveApproval
      summary: Resolve a manager approval request for a waiting harness action
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "200":
          description: Approval resolution (`data` = ApprovalResolution)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResolutionEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/haas/sessions/{session_id}/input-requests/{input_request_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/InputRequestId"
    post:
      tags: [HaaS]
      operationId: answerInputRequest
      summary: Answer a waiting structured input request
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InputRequestAnswer"
      responses:
        "200":
          description: Input request resolution (`data` = InputRequestResolution)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InputRequestResolutionEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/haas/sessions/{session_id}/artifacts:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [HaaS]
      operationId: listHaasSessionArtifacts
      summary: List HaaS artifact details for a session
      responses:
        "200":
          description: HaaS artifact list
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaasEnvelope"
  /v1/haas/files:
    post:
      tags: [HaaS]
      operationId: uploadFile
      summary: Upload a file for use as task input
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                  default: user_data
      responses:
        "200":
          description: Stored file (`data` = File)
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEnvelope"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /v1/haas/sessions/{session_id}/artifacts/archive:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [HaaS]
      operationId: downloadSessionArchive
      summary: Download all session artifacts as an archive
      responses:
        "200":
          description: Artifact archive
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/haas/files/{file_id}/content:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      tags: [HaaS]
      operationId: downloadFile
      summary: Download one artifact's raw bytes
      responses:
        "200":
          description: File bytes
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
            X-Content-Type-Options:
              required: true
              schema:
                type: string
                const: nosniff
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/haas/files/{file_id}/pdf:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      tags: [HaaS]
      operationId: previewFilePdf
      summary: Render an artifact as PDF when preview support is enabled
      responses:
        "200":
          description: PDF bytes
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "501":
          $ref: "#/components/responses/NotImplemented"
        "502":
          $ref: "#/components/responses/BadGateway"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    TraceId:
      name: X-HaaS-Trace-ID
      in: header
      required: false
      description: Correlation only, never identity or authorization. Invalid values return invalid_input.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,128}$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional idempotency key. Replaying a key returns the first result without restarting the harness.
      schema:
        type: string
        maxLength: 255
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: |
        Optional resume cursor. When set, HaaS resumes the matching invocation's stream
        instead of starting a new turn: it resolves this event id to its invocation
        (must fall within the request's appName/userId/sessionId scope), replays retained
        events after it, then goes live. No new harness turn is started on resume.
      schema:
        type: string
    AfterEventId:
      name: after_event_id
      in: query
      required: false
      schema:
        type: string
    AppName:
      name: app_name
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    DelegatedSessionId:
      name: delegated_session_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^dgsess_"
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^appr_"
    InputRequestId:
      name: input_request_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^inreq_"
    InvocationId:
      name: invocation_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^inv_"
    ToolCallId:
      name: tool_call_id
      in: path
      required: true
      schema:
        type: string
    HarnessId:
      name: harness_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^chrn_"
    ProfileId:
      name: profile_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^hprof_"
    SkillId:
      name: skill_id
      in: path
      required: true
      schema:
        type: string
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^file_"
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    Unauthorized:
      description: Missing or invalid credential
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    NotFound:
      description: Object not found in caller scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    Conflict:
      description: State conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    UnprocessableEntity:
      description: Semantically invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    RateLimited:
      description: Rate or quota limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    Forbidden:
      description: Operation is not allowed by policy or security boundary
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    ServiceUnavailable:
      description: Required service is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    PayloadTooLarge:
      description: Uploaded payload is too large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    BadGateway:
      description: Upstream service failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    NotImplemented:
      description: Capability is not implemented
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
  headers:
    IdempotencyExpiresAt:
      description: Epoch milliseconds of execution replay expiry, 24 hours after acceptance; present when Idempotency-Key was supplied. Nonterminal reservations remain protected after this time.
      schema:
        type: integer
        minimum: 0
    HaaSVersion:
      description: The HaaS native protocol version actually used to serve this response.
      required: true
      schema:
        type: string
        examples: ["2026-09-10"]
    HaaSInvocationId:
      description: Durable invocation id. Present on successful /run and /run_sse responses after the acceptance boundary.
      required: true
      schema:
        type: string
        pattern: "^inv_"
    HaaSSessionId:
      description: Effective session id, including a server-generated id when the request omitted sessionId.
      required: true
      schema:
        type: string
  schemas:
    CanonicalHaasEventBase:
      type: object
      required: [type, eventId, invocationId, sessionId, turnId, appName, harnessId, author, sequenceNumber, content, actions, haas, observedAtMs]
      properties:
        type:
          type: string
        eventId:
          type: string
          pattern: "^evt_"
        invocationId:
          type: [string, "null"]
          pattern: "^inv_"
          description: Non-null for invocation-scoped event types; null for session-scoped lifecycle event types.
        sessionId:
          type: string
        turnId:
          type: [string, "null"]
          pattern: "^turn_"
          description: Non-null for invocation-scoped event types; null for session-scoped lifecycle event types.
        appName:
          type: string
        harnessId:
          type: string
          pattern: "^chrn_"
        author:
          type: string
        sequenceNumber:
          type: integer
          minimum: 0
          description: Gapless within one invocation for invocation-scoped types, or within the session lifecycle namespace for session-scoped types.
        content:
          type: object
          required: [role, parts]
          properties:
            role:
              type: string
              enum: [model, user]
            parts:
              type: array
              items:
                $ref: "#/components/schemas/Part"
          additionalProperties: true
        actions:
          type: object
          properties:
            stateDelta:
              type: object
              additionalProperties: true
            artifactDelta:
              type: object
              additionalProperties: true
            requestedAuthConfigs:
              type: object
              additionalProperties: true
          additionalProperties: true
        haas:
          type: object
          additionalProperties: true
        observedAtMs:
          type: integer
          minimum: 0
      additionalProperties: false
    EmptyHaasEventMetadata:
      type: object
      additionalProperties: false
