          $ref: "#/components/schemas/CapabilityState"
        skills:
          $ref: "#/components/schemas/CapabilityState"
        files:
          $ref: "#/components/schemas/CapabilityState"
        usage:
          $ref: "#/components/schemas/CapabilityState"
      additionalProperties:
        $ref: "#/components/schemas/CapabilityState"
    HarnessCapabilitySnapshot:
      type: object
      required: [id, base, status, capabilities]
      properties:
        id:
          type: string
          pattern: "^chrn_"
        base:
          type: string
        activeProfileId:
          type: [string, "null"]
          pattern: "^hprof_"
        activeProfileVersion:
          type: [integer, "null"]
          minimum: 1
        activeProfileFingerprint:
          type: [string, "null"]
        status:
          type: string
          enum: [available, degraded, unavailable, unsupported]
        safeReason:
          type: [string, "null"]
        retryable:
          type: boolean
        capabilities:
          $ref: "#/components/schemas/HarnessCapabilities"
      additionalProperties: false
    CapabilitiesSnapshot:
      type: object
      required: [object, protocolVersion, adkProtocolVersion, features, workspaceModes, harnesses, generatedAtMs]
      properties:
        object:
          type: string
          const: haas_capabilities
        protocolVersion:
          type: string
        adkProtocolVersion:
          type: string
        features:
          $ref: "#/components/schemas/FeatureCapabilities"
        workspaceModes:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceCapability"
        harnesses:
          type: array
          items:
            $ref: "#/components/schemas/HarnessCapabilitySnapshot"
        generatedAtMs:
          type: integer
          minimum: 0
      additionalProperties: false
    RunRequest:
      type: object
      required: [appName, newMessage]
      properties:
        appName:
          type: string
        userId:
          type: string
        sessionId:
          type: string
        newMessage:
          type: object
          required: [role, parts]
          properties:
            role:
              type: string
              const: user
            parts:
              type: array
              items:
                $ref: "#/components/schemas/Part"
        streaming:
          type: boolean
          default: false
        haas:
          type: object
          properties:
            profileId:
              type: string
              pattern: "^hprof_"
            profileVersion:
              type: integer
              minimum: 1
            model:
              type: string
            instructions:
              type: string
            metadata:
              type: object
              additionalProperties: true
            maxOutputTokens:
              type: integer
              minimum: 1
            maxStep:
              type: integer
              minimum: 1
            timeoutSeconds:
              type: integer
              minimum: 1
          additionalProperties: false
      additionalProperties: true
    Part:
      type: object
      properties:
        text:
          type: string
        inlineData:
          type: object
          properties:
            displayName:
              type: string
            mimeType:
              type: string
            data:
              type: string
        fileId:
          type: string
        functionCall:
          type: object
          additionalProperties: true
        functionResponse:
          type: object
          additionalProperties: true
      additionalProperties: true
    Event:
      type: object
      required: [id, invocationId, author, timestamp, content, actions]
      properties:
        id:
          type: string
        invocationId:
          type: string
        author:
          type: string
        timestamp:
          type: number
        content:
          type: object
          required: [role, parts]
          properties:
            role:
              type: string
              enum: [model, user]
            parts:
              type: array
              items:
                $ref: "#/components/schemas/Part"
        actions:
          type: object
          properties:
            stateDelta:
              type: object
              additionalProperties: true
            artifactDelta:
              type: object
              additionalProperties: true
            requestedAuthConfigs:
              type: object
              additionalProperties: true
        longRunningToolIds:
          type: array
          items:
            type: string
        nodeInfo:
          type: [object, "null"]
          additionalProperties: true
        output:
          nullable: true
      additionalProperties: true
    Session:
      type: object
      required: [id, appName, userId, state, events, lastUpdateTime]
      properties:
        id:
          type: string
        appName:
          type: string
        userId:
          type: string
        state:
          type: object
          additionalProperties: true
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        lastUpdateTime:
          type: number
      additionalProperties: true
    Invocation:
      type: object
      required: [id, sessionId, appName, status, acceptedAtMs, sessionControl]
      properties:
        idempotencyExpiresAtMs:
          type: [integer, "null"]
          minimum: 0
          description: Server-authoritative replay expiry; null when no execution key exists.
        terminalEventId:
          type: [string, "null"]
          description: Authoritative terminal record used to reconcile independent ADK/native streams.
        id:
          type: string
          pattern: "^inv_"
        sessionId:
          type: string
        appName:
          type: string
        status:
          type: string
          enum: [accepted, running, pausing, completed, failed, incomplete, interrupted, cancelling, cancelled]
        continuedFromInvocationId:
          type: [string, "null"]
          pattern: "^inv_"
        continuedFromTurnId:
          type: [string, "null"]
          pattern: "^turn_"
        sessionControl:
          $ref: "#/components/schemas/SessionControl"
        acceptedAtMs:
          type: integer
          minimum: 0
        startedAtMs:
          type: [integer, "null"]
          minimum: 0
        completedAtMs:
          type: [integer, "null"]
        model:
          type: string
        error:
          type: [object, "null"]
          additionalProperties: true
      additionalProperties: true
    SessionControl:
      type: object
      required: [controlState, supportsResume, resumableInvocationId]
      properties:
        controlState:
          type: string
          enum: [idle, running, pausing, paused, resuming, cancelling, cancelled, control_degraded]
        supportsResume:
          type: boolean
        resumableInvocationId:
          type: [string, "null"]
          pattern: "^inv_"
      additionalProperties: false
    ContinueInvocationRequest:
      type: object
      properties:
        additionalInstruction:
          type: string
          maxLength: 4000
      additionalProperties: false
    DelegatedSessionCreate:
      type: object
      required: [managerSessionId, haasSessionId, haasUserId, harnessId, image, profileRef, provider, workspaceMode, mountManifest]
      properties:
        managerSessionId:
          type: string
        haasSessionId:
          type: string
        haasUserId:
          type: string
        harnessId:
          type: string
          pattern: "^chrn_"
        image:
          $ref: "#/components/schemas/DelegatedImage"
        profileRef:
          $ref: "#/components/schemas/DelegatedProfileRef"
        provider:
          $ref: "#/components/schemas/DelegatedProvider"
        workspaceMode:
          type: string
          const: bind_mount
          description: P0 only. snapshot_upload and remote_workspace are not accepted by this request schema.
        mountManifest:
          $ref: "#/components/schemas/MountManifest"
        delegationPolicySnapshot:
          $ref: "#/components/schemas/DelegationPolicy"
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: false
    HarnessProfileCreate:
      type: object
      required: [harnessId, base, provider]
      properties:
        harnessId:
          type: string
          pattern: "^chrn_"
        base:
          type: string
        name:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderRoute"
        mcpServers:
          type: array
          items:
            $ref: "#/components/schemas/McpServerConfig"
          default: []
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillBundle"
          default: []
        agentsMd:
          $ref: "#/components/schemas/AgentsMdConfig"
        workspace:
          $ref: "#/components/schemas/WorkspaceProfile"
        policy:
          $ref: "#/components/schemas/ProfilePolicy"
        budget:
          $ref: "#/components/schemas/ProfileBudget"
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: false
    HarnessProfile:
      type: object
      required: [id, object, harnessId, base, provider, version, status, profileFingerprint, createdAtMs, updatedAtMs, activatedAtMs]
      properties:
        id:
          type: string
          pattern: "^hprof_"
        object:
          type: string
          const: harness_profile
        harnessId:
          type: string
          pattern: "^chrn_"
        base:
          type: string
        name:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderRoute"
        mcpServers:
          type: array
          items:
            $ref: "#/components/schemas/McpServerConfig"
          default: []
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillBundle"
          default: []
        agentsMd:
          $ref: "#/components/schemas/AgentsMdConfig"
        workspace:
          $ref: "#/components/schemas/WorkspaceProfile"
        policy:
          $ref: "#/components/schemas/ProfilePolicy"
        budget:
          $ref: "#/components/schemas/ProfileBudget"
        metadata:
          type: object
          additionalProperties: true
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [draft, active, retired]
        profileFingerprint:
          type: string
        validation:
          $ref: "#/components/schemas/ProfileValidation"
        createdAtMs:
          type: integer
          minimum: 0
        updatedAtMs:
          type: integer
          minimum: 0
        activatedAtMs:
          type: [integer, "null"]
          minimum: 0
      additionalProperties: false
    ProviderRoute:
      type: object
      required: [providerId, name, model, credentialRef, wireApi]
      properties:
        providerId:
          type: string
          description: Stable provider identity. Retained alongside the human-readable `name`.
        name:
          type: string
          description: Human-readable provider alias. Both `providerId` and `name` are retained.
        model:
          type: string
        credentialRef:
          type: string
        credentialFingerprint:
          type: string
        baseUrl:
          type: string
          format: uri
        wireApi:
          type: string
          enum: [openai-compatible, responses, agent-plan]
          description: |
            Request/stream protocol. `openai-compatible` = the OpenAI-compatible
            protocol family; `responses` = require the OpenAI Responses protocol
            type within that family; `agent-plan` = the Ark Agent Plan protocol.
        apiType:
          type: string
          enum: [responses, chat_completions]
          description: Required for openai-compatible and agent-plan; responses wireApi implies responses and rejects chat_completions. No protocol guessing or silent conversion.
        allowlistRuleId:
          type: string
      allOf:
        - if:
            required: [wireApi]
            properties:
              wireApi: {enum: [openai-compatible, agent-plan]}
          then:
            required: [apiType]
        - if:
            required: [wireApi]
            properties:
              wireApi: {const: responses}
          then:
            properties:
              apiType: {const: responses}
      additionalProperties: false
    McpServerConfig:
      type: object
      required: [name, url, transport, enabled]
      properties:
        name:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
        transport:
          type: string
          enum: [http, sse]
          description: P0 brokered transports; stdio is unavailable until command/args/env and process lifecycle are specified.
        enabled:
          type: boolean
        headers:
          type: object
          additionalProperties:
            type: string
        auth:
          type: object
          required: [type, ref]
          properties:
            type:
              type: string
              enum: [secret_ref]
            ref:
              type: string
          additionalProperties: false
        timeoutSeconds:
          type: integer
          minimum: 1
          default: 60
        required:
          type: boolean
          default: false
      additionalProperties: false
    SkillBundle:
      type: object
      required: [id, name, enabled, files]
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        files:
          type: array
          items:
            $ref: "#/components/schemas/SkillFile"
        fingerprint:
          type: string
      additionalProperties: false
    AgentsMdConfig:
      type: object
      required: [mode, sources, maxBytes]
      properties:
        mode:
          type: string
          enum: [snapshot]
        sources:
          type: array
          items:
            $ref: "#/components/schemas/AgentsMdSource"
        maxBytes:
          type: integer
          minimum: 1
          maximum: 1048576
      additionalProperties: false
    AgentsMdSource:
      type: object
      required: [scope, path, contentRef, fingerprint]
      properties:
        scope:
          type: string
          enum: [global, workspace, directory]
        path:
          type: string
          description: Relative profile materialization path. Absolute paths, `..`, control characters, and symlink escapes are invalid and must fail closed.
        contentRef:
          type: string
          pattern: "^file_"
          description: Immutable caller-owned upload id from POST /v1/haas/files.
        fingerprint:
          type: string
      additionalProperties: false
    WorkspaceProfile:
      type: object
      required: [mode, roots]
      properties:
        mode:
          type: string
          enum: [bind_mount, snapshot_upload, remote_workspace]
        roots:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceRoot"
      additionalProperties: false
    WorkspaceRoot:
      type: object
      required: [containerPath, access]
      properties:
        containerPath:
          type: string
        access:
          type: string
          enum: [ro, rw]
      additionalProperties: false
    ProfilePolicy:
      type: object
      properties:
        network:
          type: object
          properties:
            defaultAction:
              type: string
              enum: [allow, deny]
            allow:
              type: array
              items:
                type: string
          additionalProperties: false
        tools:
          type: object
          properties:
            disabled:
              type: array
              items:
                type: string
            approvalMode:
              type: string
              enum: [never, on-request, always]
          additionalProperties: false
        model:
          type: object
          properties:
            allowedModels:
              type: array
              items:
                type: string
            fallbackModel:
              type: [string, "null"]
          additionalProperties: false
      additionalProperties: false
    ProfileBudget:
      type: object
      properties:
        maxStep:
          type: integer
          minimum: 1
        timeoutSeconds:
          type: integer
          minimum: 1
        maxOutputTokens:
          type: integer
          minimum: 1
      additionalProperties: false
    ProfileValidation:
      type: object
      required: [profileId, valid, findings]
      properties:
        profileId:
          type: string
          pattern: "^hprof_"
        valid:
          type: boolean
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ProfileValidationFinding"
      additionalProperties: false
    ProfileValidationFinding:
      type: object
      required: [severity, code, safeReason]
      properties:
        severity:
          type: string
          enum: [error, warning, info]
        code:
          type: string
        safeReason:
          type: string
        field:
          type: [string, "null"]
      additionalProperties: false
    EffectiveHarnessProfile:
      type: object
      required: [profileId, profileVersion, profileFingerprint, harnessId, base, resolvedAtMs]
      properties:
        profileId:
          type: string
          pattern: "^hprof_"
        profileVersion:
          type: integer
          minimum: 1
        profileFingerprint:
          type: string
        harnessId:
          type: string
          pattern: "^chrn_"
        base:
          type: string
        providerFingerprint:
          type: string
        mcpVersion:
          type: string
        skillsVersion:
          type: string
        agentsMdVersion:
          type: string
        workspacePolicyVersion:
          type: string
        resolvedAtMs:
          type: integer
          minimum: 0
      additionalProperties: false
    SessionProfileRecoveryRef:
      type: object
      required: [profileId, profileVersion, profileFingerprint, harnessId, base, executionIntentFingerprint]
      properties:
        profileId:
          type: string
          pattern: "^hprof_"
        profileVersion:
          type: integer
          minimum: 1
        profileFingerprint:
          type: string
        harnessId:
          type: string
          pattern: "^chrn_"
        base:
          type: string
        executionIntentFingerprint:
          type: string
          description: Stable hash of execution-affecting profile content after opaque credential references are removed.
      additionalProperties: false
    SessionProfileRecoveryEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/SessionProfileRecoveryRef"
    ProfileRebindRequest:
      type: object
      description: |
        Non-delegated sessions only. Wait for running work, replace the applied
        snapshot under the session lease, and preserve the same session/history.
        An identical target is a no-op; versions cannot move backward.
        expectedProfileVersion compares against the currently applied version.
      required: [profileId]
      properties:
        profileId:
          type: string
          pattern: "^hprof_"
        expectedProfileVersion:
          type: integer
          minimum: 1
        reason:
          type: string
      additionalProperties: false
    SessionWorkspacePolicy:
      type: object
      required: [mode, root, writableRoots]
      properties:
        mode:
          type: string
          enum: [read-only, workspace-write, danger-full-access]
        root:
          type: string
          description: Canonical sandbox workspace root, never a host path.
        writableRoots:
          type: array
          uniqueItems: true
          items: {type: string}
      additionalProperties: false
    SessionNetworkPolicy:
      type: object
      required: [defaultAction, allow]
      properties:
        defaultAction:
          type: string
          enum: [deny, allow]
        allow:
          type: array
          uniqueItems: true
          items: {type: string}
      additionalProperties: false
    SessionToolsPolicy:
      type: object
      required: [disabled, approvalMode]
      properties:
        disabled:
          type: array
          uniqueItems: true
          items: {type: string}
        approvalMode:
          type: string
          enum: [never, on-request, always]
          description: "`never` disables prompting and does not grant unrestricted execution."
      additionalProperties: false
    SessionPolicy:
      type: object
      properties:
        workspace:
          $ref: "#/components/schemas/SessionWorkspacePolicy"
        network:
          $ref: "#/components/schemas/SessionNetworkPolicy"
        tools:
          $ref: "#/components/schemas/SessionToolsPolicy"
      minProperties: 1
      additionalProperties: false
    EffectiveSessionPolicy:
      type: object
      required: [workspace, network, tools]
      properties:
        workspace:
          $ref: "#/components/schemas/SessionWorkspacePolicy"
        network:
          $ref: "#/components/schemas/SessionNetworkPolicy"
        tools:
          $ref: "#/components/schemas/SessionToolsPolicy"
      additionalProperties: false
    SessionPolicyUpdateRequest:
      type: object
      required: [expectedRevision, policy]
      properties:
        expectedRevision:
          type: integer
          minimum: 1
          description: Must equal the current desired revision or the server returns haas_policy_revision_conflict.
        policy:
          $ref: "#/components/schemas/SessionPolicy"
      additionalProperties: false
    SessionPolicyRevision:
      type: object
      required: [sessionId, desiredRevision, appliedRevision, status, desiredPolicy, appliedPolicy]
      properties:
        sessionId:
          type: string
        desiredRevision:
          type: integer
          minimum: 1
        appliedRevision:
          type: integer
          minimum: 1
          description: Never exceeds desiredRevision and advances only after verified application.
        status:
          type: string
          enum: [pending, applied, failed]
        desiredPolicy:
          allOf:
            - $ref: "#/components/schemas/EffectiveSessionPolicy"
          description: Complete target snapshot associated with desiredRevision.
        appliedPolicy:
          allOf:
            - $ref: "#/components/schemas/EffectiveSessionPolicy"
          description: Complete verified snapshot associated with appliedRevision; remains unchanged on apply failure.
        code:
          type: string
          description: Stable HaaS error code; required when status is failed.
        safeReason:
          type: string
      allOf:
        - if:
            required: [status]
            properties:
              status: {const: failed}
          then:
            required: [code, safeReason]
      additionalProperties: false
    DelegatedSessionRestore:
      type: object
      properties:
        reason:
          type: string
          enum: [follow_up_turn, process_restart, manual_restore]
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: false
    DelegatedSessionPolicyUpdate:
      type: object
      description: |
        Supplied complete domains replace previous values; omitted domains remain
        unchanged. Validate authority and content, persist the full desired target
        and increment desiredRevision. Reconcile independently of a next turn,
        waiting for accepted/running/cancelling work and restore to quiesce.
        Advance appliedRevision only after runtime verification; record failure
        without advancing it and gate new turns. Occupancy alone is not a 409.
        Preserve the same logical session and native history.
      anyOf:
        - required: [delegationPolicySnapshot]
        - required: [mountManifest]
        - required: [profileRef]
        - required: [image]
      properties:
        expectedRevision:
          type: integer
          minimum: 1
          description: Optional optimistic concurrency guard against the current desiredRevision.
        image:
          $ref: "#/components/schemas/DelegatedImage"
        delegationPolicySnapshot:
          $ref: "#/components/schemas/DelegationPolicy"
        mountManifest:
          $ref: "#/components/schemas/MountManifest"
        profileRef:
          $ref: "#/components/schemas/DelegatedProfileRef"
        reason:
          type: string
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: false
    DelegatedSessionContract:
      type: object
      required: [id, object, managerSessionId, haasSessionId, haasUserId, harnessId, binding, image, profileRef, provider, workspaceMode, mountManifest, delegationPolicySnapshot, runtime, acceptedInvocationId, bindingAcceptedAtMs, bindingFailureSafeReason, desiredRevision, appliedRevision, pendingPolicyUpdate, lastPolicyUpdateResult, createdAtMs, updatedAtMs]
      properties:
        id:
          type: string
          pattern: "^dgsess_"
        object:
          type: string
          const: delegated_session
        managerSessionId:
          type: string
        haasSessionId:
          type: string
        haasUserId:
          type: string
        harnessId:
          type: string
          pattern: "^chrn_"
        harnessBase:
          type: string
        binding:
          type: string
          enum: [prepared, haas_bound, bind_failed]
        image:
          $ref: "#/components/schemas/DelegatedImage"
        profileRef:
          $ref: "#/components/schemas/DelegatedProfileRef"
        provider:
          $ref: "#/components/schemas/DelegatedProvider"
        workspaceMode:
          type: string
          const: bind_mount
        mountManifest:
          $ref: "#/components/schemas/MountManifest"
        delegationPolicySnapshot:
          $ref: "#/components/schemas/DelegationPolicy"
        runtime:
          $ref: "#/components/schemas/DelegatedRuntime"
        acceptedInvocationId:
          type: [string, "null"]
          pattern: "^inv_"
        bindingAcceptedAtMs:
          type: [integer, "null"]
          minimum: 0
        bindingFailureSafeReason:
          type: [string, "null"]
        desiredRevision:
          type: integer
          minimum: 1
        appliedRevision:
          type: integer
          minimum: 1
          description: Never exceeds desiredRevision; advances only after verified runtime application.
        lastPolicyUpdateResult:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/PolicyUpdateResult"
        pendingPolicyUpdate:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/PendingPolicyUpdate"
        createdAtMs:
          type: integer
          minimum: 0
        updatedAtMs:
          type: integer
          minimum: 0
      allOf:
        - if:
            properties:
              binding: {const: prepared}
          then:
            properties:
              acceptedInvocationId: {const: null}
              bindingAcceptedAtMs: {const: null}
        - if:
            properties:
              binding: {const: haas_bound}
          then:
            properties:
              acceptedInvocationId: {type: string, pattern: "^inv_"}
              bindingAcceptedAtMs: {type: integer, minimum: 0}
              bindingFailureSafeReason: {const: null}
        - if:
            properties:
              binding: {const: bind_failed}
          then:
            properties:
              acceptedInvocationId: {const: null}
              bindingAcceptedAtMs: {const: null}
              bindingFailureSafeReason: {type: string, minLength: 1}
      additionalProperties: true
    DelegatedImage:
      type: object
      required: [reference]
      properties:
        reference:
          type: string
        digest:
          type: [string, "null"]
        variant:
          type: string
          enum: [lite, aio]
          default: lite
          description: |
            Image variant. `lite` is the default minimal sandbox image
            (Mac Apple Silicon uses Docker CLI and linux/arm64; no Linux build
            host or amd64 cross-build is required). `aio` is OpenSandbox AIO
            for desktop / X11 / VNC capability, currently linux/amd64 only.
        platform:
          type: string
          enum: [linux/arm64, linux/amd64]
          description: Resolved from the Docker execution node and selected manifest, not the Manager host.
      additionalProperties: false
    DelegatedProfileRef:
      type: object
      required: [profileId, profileVersion, profileFingerprint]
      properties:
        profileId:
          type: string
          pattern: "^hprof_"
        profileVersion:
          type: integer
          minimum: 1
        profileFingerprint:
          type: string
      additionalProperties: false
    PendingPolicyUpdate:
      type: object
      required: [updateId, revision, requestedAtMs, fields]
      description: Public summary only; the private store retains the full resolved target and authorization. Null does not establish success; compare desiredRevision/appliedRevision and lastPolicyUpdateResult.
      properties:
        updateId:
          type: string
          minLength: 1
        revision:
          type: integer
          minimum: 1
        requestedAtMs:
          type: integer
          minimum: 0
        fields:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [delegationPolicySnapshot, mountManifest, profileRef, image]
          minItems: 1
      additionalProperties: false
    PolicyUpdateResult:
      type: object
      required: [updateId, revision, status]
      properties:
        updateId: {type: string, minLength: 1}
        revision: {type: integer, minimum: 1}
        status: {type: string, enum: [applied, failed]}
        code: {type: string, description: Existing HaaS error catalog code; required for failure.}
        safeReason: {type: string}
      allOf:
        - if:
            required: [status]
            properties:
              status: {const: failed}
          then:
            required: [code, safeReason]
      additionalProperties: false
    DelegatedProvider:
      type: object
      description: Effective route derived from the frozen profile and authorized management override; refreshed atomically on profile application. Creation input must match the selected effective profile; it is not a second mutable route owner.
      required: [providerId, name, model, credentialRef, wireApi]
      properties:
        providerId: {type: string}
        name: {type: string}
        model: {type: string}
        credentialRef: {type: string}
        baseUrl: {type: string, format: uri}
        wireApi: {type: string, enum: [openai-compatible, responses, agent-plan]}
        apiType: {type: string, enum: [responses, chat_completions]}
        providerFingerprint: {type: string}
      allOf:
        - if:
            required: [wireApi]
            properties:
              wireApi: {enum: [openai-compatible, agent-plan]}
          then:
            required: [apiType]
        - if:
            required: [wireApi]
            properties:
              wireApi: {const: responses}
          then:
            properties:
              apiType: {const: responses}
      additionalProperties: false
    MountManifest:
      type: object
      required: [version, primaryWorkspace]
      properties:
        version:
          type: integer
          minimum: 1
        primaryWorkspace:
          $ref: "#/components/schemas/MountEntry"
        extraMounts:
          type: array
          items:
            $ref: "#/components/schemas/MountEntry"
          default: []
      additionalProperties: false
    MountEntry:
      type: object
      required: [hostPathCanonical, containerPath, access]
      properties:
        hostPathCanonical:
          type: string
        containerPath:
          type: string
        access:
          type: string
          enum: [ro, rw]
      additionalProperties: false
    DelegationPolicy:
      type: object
      required: [version, idleTtlSeconds, maxContainerLifetimeSeconds, rwWorkspaceConcurrency, queuePolicy, restorePolicy, mountPolicy]
      properties:
        version:
          type: integer
          minimum: 1
        idleTtlSeconds:
          type: integer
          minimum: 1
        maxContainerLifetimeSeconds:
          type: integer
          minimum: 1
        rwWorkspaceConcurrency:
          type: string
          enum: [single_writer]
        queuePolicy:
          type: string
          enum: [fifo]
        restorePolicy:
          type: string
          enum: [fail_closed]
        policyChangeMode:
          type: string
          enum: [snapshot_per_session]
          default: snapshot_per_session
        mountPolicy:
          type: string
          enum: [project_rw_extra_ro]
        network:
          type: object
          description: New OpenHarness sessions materialize allow with an empty allow list. Already-created legacy snapshots that omit this field remain fail-closed as deny.
          required: [defaultAction, allow]
          properties:
            defaultAction: {type: string, enum: [deny, allow]}
            allow:
              type: array
              items: {type: string}
          additionalProperties: false
        tools:
          type: object
          description: New OpenHarness sessions materialize on-request. Already-created legacy snapshots that omit this field remain no-prompt.
          required: [disabled, approvalMode]
          properties:
            disabled:
              type: array
              uniqueItems: true
              items: {type: string}
            approvalMode:
              type: string
              enum: [never, on-request, always]
          additionalProperties: false
      additionalProperties: false
    DelegatedRuntime:
      type: object
      required: [status, containerGeneration]
      properties:
        status:
          type: string
          enum: [no_runtime, creating, running, idle, ttl_destroyed, restoring, draining, destroyed, failed]
        containerId:
          type: [string, "null"]
        containerGeneration:
          type: integer
          minimum: 0
        lastStartedAtMs:
          type: [integer, "null"]
        lastActiveAtMs:
          type: [integer, "null"]
      additionalProperties: true
    ApprovalRecordPublic:
      type: object
      required: [id, sessionId, invocationId, status, request, createdAtMs]
      properties:
        id: {type: string, pattern: "^appr_"}
        sessionId: {type: string}
        invocationId: {type: string, pattern: "^inv_"}
        status: {type: string, enum: [waiting, approved, denied, expired, cancelled]}
        request:
          type: object
          required: [kind, safeSummary, policyReason, availableDecisions, expiresAtMs]
          properties:
            kind: {type: string}
            safeSummary: {type: string}
            policyReason: {type: string}
            availableDecisions:
              type: array
              minItems: 1
              uniqueItems: true
              items: {type: string, enum: [approved, denied, cancelled]}
            availableScopes:
              type: array
              uniqueItems: true
              items: {type: string, enum: [action]}
            expiresAtMs: {type: integer, minimum: 0}
          additionalProperties: false
        createdAtMs: {type: integer, minimum: 0}
        resolvedAtMs: {type: [integer, "null"], minimum: 0}
      additionalProperties: false
    InputQuestion:
      type: object
      required: [id, question]
      properties:
        id: {type: string, minLength: 1}
        header: {type: string}
        question: {type: string, minLength: 1}
        options:
          type: array
          items:
            $ref: "#/components/schemas/InputQuestionOption"
        allowText: {type: boolean}
        multi: {type: boolean}
        secret: {type: boolean, default: false}
      additionalProperties: false
    InputQuestionOption:
      type: object
      required: [label]
      properties:
        label: {type: string, minLength: 1}
        description: {type: string}
      additionalProperties: false
    InputAnswer:
      type: object
      properties:
        values:
          type: array
          minItems: 1
          items: {type: string}
        secretRef:
          type: string
          description: Private handle used instead of values for a secret question.
      oneOf:
        - required: [values]
          not: {required: [secretRef]}
        - required: [secretRef]
          not: {required: [values]}
      additionalProperties: false
    InputRequestRecordPublic:
      type: object
      required: [id, sessionId, invocationId, turnId, status, questions, blocking, createdAtMs, expiresAtMs]
      properties:
        id: {type: string, pattern: "^inreq_"}
        sessionId: {type: string}
        invocationId: {type: string, pattern: "^inv_"}
        turnId: {type: string}
        status: {type: string, enum: [waiting, answered, expired, cancelled]}
        questions:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/InputQuestion"}
        blocking: {type: boolean}
        createdAtMs: {type: integer, minimum: 0}
        expiresAtMs: {type: integer, minimum: 0}
        resolvedAtMs: {type: [integer, "null"], minimum: 0}
      additionalProperties: false
    InputRequestAnswer:
      type: object
      required: [answers]
      properties:
        answers:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/InputAnswer"
      additionalProperties: false
    InputRequestResolution:
      type: object
      required: [inputRequestId, sessionId, status, resolvedAtMs]
      properties:
        inputRequestId: {type: string, pattern: "^inreq_"}
        sessionId: {type: string}
        status: {type: string, enum: [answered, expired, cancelled]}
        resolvedAtMs: {type: integer, minimum: 0}
      additionalProperties: false
    ApprovalDecision:
      type: object
      required: [decision, scope]
      properties:
        decision:
          type: string
          enum: [approved, denied, cancelled]
        scope:
          type: string
          const: action
          description: Authorizes only this exact approval record's native action; never mutates session policy.
        reason:
          type: string
        expiresAtMs:
          type: [integer, "null"]
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: false
    ApprovalResolution:
      type: object
      required: [approvalId, sessionId, status]
      properties:
        approvalId:
          type: string
          pattern: "^appr_"
        sessionId:
          type: string
        status:
          type: string
          enum: [approved, denied, expired, cancelled]
        resolvedAtMs:
          type: integer
          minimum: 0
      additionalProperties: true
    SkillFile:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Relative profile materialization path. Absolute paths, `..`, control characters, and symlink escapes are invalid and must fail closed.
        content:
          type: string
        contentB64:
          type: string
        contentRef:
          type: string
          pattern: "^file_"
          description: Caller-owned immutable upload id, retained while referenced by a profile/session.
      oneOf:
        - required: [content]
        - required: [contentB64]
        - required: [contentRef]
      additionalProperties: false
    File:
      type: object
      required: [id, object, filename, bytes]
      properties:
        id:
          type: string
          pattern: "^file_"
        object:
          type: string
          const: file
        sessionId:
          type: string
        invocationId:
          type: string
        filename:
          type: string
        relativePath:
          type: string
        bytes:
          type: integer
          minimum: 0
        mediaType:
          type: string
        sha256:
          type: string
        createdAtMs:
          type: integer
          minimum: 0
      additionalProperties: true
    HarnessCreate:
      type: object
      required: [base]
      description: |
        Configured harness identity input. Dynamic runtime configuration belongs
        to HarnessProfile. Legacy projection fields in this schema are accepted
        only for read-modify-write compatibility and must not bypass profile
        validation in new implementations.
      properties:
        name:
          type: string
        base:
          type: string
        activeProfileId:
          type: string
          pattern: "^hprof_"
        defaultModel:
          type: string
          deprecated: true
          description: Legacy projection of the active profile model; use HarnessProfile.provider.model for writes.
        systemPrompt:
          type: string
          deprecated: true
          description: Legacy projection; use HarnessProfile/AGENTS.md snapshot fields for new writes.
        mcpServers:
          type: array
          deprecated: true
          description: Legacy projection; use HarnessProfile.mcpServers for new writes.
          items:
            type: object
            additionalProperties: true
        skills:
          type: array
          deprecated: true
          description: Legacy projection; use HarnessProfile.skills for new writes.
          items:
            type: object
            additionalProperties: true
        disabledTools:
          type: array
          deprecated: true
          description: Legacy projection; use HarnessProfile.policy.tools.disabled for new writes.
          items:
            type: string
        provider:
          type: object
          deprecated: true
          description: Legacy projection; use HarnessProfile.provider for new writes.
          additionalProperties: true
        maxStep:
          type: [integer, "null"]
          deprecated: true
          description: Legacy projection; use HarnessProfile.budget.maxStep for new writes.
        timeoutSeconds:
          type: [integer, "null"]
          deprecated: true
          description: Legacy projection; use HarnessProfile.budget.timeoutSeconds for new writes.
      additionalProperties: true
    Harness:
      type: object
      required: [id, object, name, base, createdAtMs]
      properties:
        id:
          type: string
        object:
          type: string
          const: harness
        name:
          type: string
        base:
          type: string
        baseLabel:
          type: string
        activeProfileId:
          type: [string, "null"]
          pattern: "^hprof_"
        activeProfileVersion:
          type: [integer, "null"]
          minimum: 1
        activeProfileFingerprint:
          type: [string, "null"]
        defaultModel:
          type: string
        systemPrompt:
          type: string
        mcpServers:
          type: array
          items:
            type: object
            additionalProperties: true
        skills:
          type: array
          items:
            type: object
            additionalProperties: true
        disabledTools:
          type: array
          items:
            type: string
        provider:
          type: object
          additionalProperties: true
        maxStep:
          type: [integer, "null"]
        timeoutSeconds:
          type: [integer, "null"]
        adapterCapabilities:
          type: object
          additionalProperties: true
        createdAtMs:
          type: integer
          minimum: 0
        updatedAtMs:
          type: integer
          minimum: 0
      additionalProperties: true
    ModelCatalog:
      type: object
      required: [backends]
      properties:
        backends:
          type: object
          additionalProperties:
            type: object
            required: [default, models]
            properties:
              default:
                type: string
              models:
                type: array
                items:
                  type: object
                  additionalProperties: true
    HaasEnvelope:
      type: object
      required: [data, traceId]
      description: |
        HaaS native response envelope. `data` carries the resource (object or array).
        Paginated list responses additionally include `nextCursor` (null when exhausted).
        Additional optional fields may be added within a protocol version.
      properties:
        data: {}
        nextCursor:
          type: [string, "null"]
        traceId:
          type: string
    CapabilitiesEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/CapabilitiesSnapshot"
    HarnessEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/Harness"
    ProfileEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/HarnessProfile"
    ProfileListEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data, nextCursor]
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/HarnessProfile"
            nextCursor:
              type: [string, "null"]
    ProfileValidationEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ProfileValidation"
    EffectiveProfileEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/EffectiveHarnessProfile"
    HarnessListEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [harnesses]
              properties:
                harnesses:
                  type: array
                  items:
                    $ref: "#/components/schemas/Harness"
    FileEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/File"
    CanonicalEventPageEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data, nextCursor]
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/CanonicalHaasEvent"
            nextCursor:
              type: [string, "null"]
    ApprovalListEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data, nextCursor]
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ApprovalRecordPublic"
            nextCursor:
              type: [string, "null"]
    InputRequestListEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data, nextCursor]
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/InputRequestRecordPublic"
            nextCursor:
              type: [string, "null"]
    InvocationEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/Invocation"
    ExecutionEvidenceEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ExecutionEvidence"
    DelegatedSessionEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/DelegatedSessionContract"
    SessionPolicyRevisionEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/SessionPolicyRevision"
    ApprovalResolutionEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ApprovalResolution"
    InputRequestResolutionEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/InputRequestResolution"
    ModelCatalogEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ModelCatalog"
    SkillFilesEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [id, name, files]
              properties:
                id:
                  type: string
                name:
                  type: string
                files:
                  type: array
                  items:
                    $ref: "#/components/schemas/SkillFile"
    SessionListEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Session"
    ErrorDetail:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
        haasError:
          type: object
          required: [type, code]
          properties:
            type:
              type: string
            code:
              enum:
                - missing_credential
                - invalid_credential
                - app_not_found
                - haas_harness_not_found
                - haas_profile_not_found
                - haas_profile_conflict
                - haas_profile_rebind_required
                - haas_profile_rebind_unsupported
                - haas_agents_md_invalid
                - session_not_found
                - haas_invocation_not_found
                - haas_execution_evidence_not_found
                - haas_execution_evidence_expired
                - haas_delegated_session_not_found
                - haas_file_not_found
                - invalid_input
                - haas_unsupported_base
                - haas_tool_schema_unsupported
                - session_busy
                - session_expired
                - haas_offset_expired
                - haas_cancel_unsupported
                - haas_invocation_not_running
                - haas_resume_required
                - haas_invocation_not_resumable
                - haas_delegated_session_conflict
                - haas_approval_not_found
                - haas_approval_state_conflict
                - haas_input_request_not_found
                - haas_input_request_state_conflict
                - haas_interaction_unsupported
                - haas_policy_denied
                - haas_policy_invalid
                - haas_policy_unsupported
                - haas_policy_revision_conflict
                - haas_url_not_allowed
                - haas_secret_input_invalid
                - haas_provider_source_invalid
                - haas_mcp_source_invalid
                - haas_skill_source_invalid
                - haas_adapter_unavailable
                - haas_adapter_incompatible
                - haas_adapter_overloaded
                - haas_adapter_error
                - haas_model_unavailable
                - haas_provider_error
                - haas_provider_timeout
                - haas_model_proxy_token_invalid
                - haas_model_proxy_token_expired
                - haas_mcp_unavailable
                - haas_sandbox_widening_rejected
                - haas_vault_unavailable
                - haas_request_timeout
                - haas_delegation_backend_unavailable
                - haas_delegation_restore_failed
                - haas_delegation_mount_invalid
                - haas_delegation_image_unavailable
                - haas_workspace_lock_busy
                - haas_workspace_lock_timeout
                - haas_rate_limited
                - haas_quota_exceeded
                - haas_queue_full
                - haas_queue_timeout
                - haas_store_unavailable
                - haas_idempotency_store_unavailable
                - haas_idempotency_conflict
                - haas_idempotency_expired
                - haas_identity_unavailable
                - haas_session_read_too_large
                - haas_file_too_large
                - haas_preview_unavailable
                - haas_archive_failed
              type: string
            param:
              type: [string, "null"]
            safeReason:
              type: string
            retryable:
              type: boolean
            traceId:
              type: string
            accepted:
              type: boolean
              description: True only when an invocation was durably accepted before a post-acceptance integrity failure.
            invocationId:
              type: string
              pattern: "^inv_"
              description: Present with accepted=true so the caller can reconcile through readback.
          allOf:
            - if:
                properties:
                  accepted: {const: true}
                required: [accepted]
              then:
                required: [invocationId]
          additionalProperties: true
      additionalProperties: true
