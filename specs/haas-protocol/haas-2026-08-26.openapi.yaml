openapi: 3.1.0
info:
  title: Harness As A Service Protocol (ADK 2.0)
  version: "2026-08-26"
  summary: ADK 2.0-compatible protocol surface for HaaS.
  description: |
    HaaS exposes the Google ADK 2.0 REST API protocol layer as its northbound contract,
    plus HaaS-native control-plane extensions and mpa-codex-worker migration shims.
    Prose in README.md is normative when behavior cannot be expressed in OpenAPI.
servers:
  - url: http://127.0.0.1:8092
    description: Local HaaS sidecar
security:
  - bearerAuth: []
tags:
  - name: Discovery
  - name: Execution
  - name: Sessions
  - name: HaaS
  - name: Legacy
paths:
  /health:
    get:
      tags: [HaaS]
      operationId: getHealthAlias
      summary: Container liveness alias for HaaS health
      security: []
      responses:
        "200":
          description: Health snapshot
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaasEnvelope"
  /ready:
    get:
      tags: [HaaS]
      operationId: getReadyAlias
      summary: Container readiness alias for HaaS readiness
      security: []
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [control, execution, capability]
            default: execution
      responses:
        "200":
          description: Ready snapshot
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaasEnvelope"
  /list-apps:
    get:
      tags: [Discovery]
      operationId: listApps
      summary: List configured harness app names in caller scope
      responses:
        "200":
          description: Array of app names (harness ids)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /run:
    post:
      tags: [Execution]
      operationId: runAgent
      summary: Run a harness and return all events in one JSON array
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: Array of events after run completion
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
  /run_sse:
    post:
      tags: [Execution]
      operationId: runAgentSse
      summary: Run a harness and stream events over SSE
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/LastEventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: SSE stream of ADK events
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-cache
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
  /apps/{app_name}/users/{user_id}/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/AppName"
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Get one session with state and events
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Sessions]
      operationId: updateSession
      summary: Update session state via stateDelta
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stateDelta]
              properties:
                stateDelta:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Sessions]
      operationId: deleteSession
      summary: Delete a session and its data
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/haas/health:
    get:
      tags: [HaaS]
      operationId: getHaasHealth
      summary: HaaS process liveness
      security: []
      responses:
        "200":
          description: Health snapshot
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaasEnvelope"
  /v1/haas/ready:
    get:
      tags: [HaaS]
      operationId: getHaasReady
      summary: HaaS readiness by scope
      security: []
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [control, execution, capability]
            default: execution
      responses:
        "200":
          description: Ready snapshot
          headers:
            HaaS-Version:
              $ref: "#/components/headers/HaaSVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaasEnvelope"
  /v1/haas/status:
    get:
      tags: [HaaS]
      operationId: getHaasStatus
      summary: HaaS diagnostic status
      responses:
        "200":
          description: Status snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaasEnvelope"
  /v1/haas/diagnostics:
    get:
      tags: [HaaS]
      operationId: getHaasDiagnostics
      summary: Redacted HaaS diagnostics
      responses:
        "200":
          description: Diagnostic snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaasEnvelope"
  /v1/haas/harnesses:
    get:
      tags: [HaaS]
      operationId: listHaasHarnesses
      summary: List configured harnesses with details
      responses:
        "200":
          description: Harness list wrapped in the HaaS envelope (`data.harnesses`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessListEnvelope"
    post:
      tags: [HaaS]
      operationId: createHarness
      summary: Create a configured harness
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarnessCreate"
      responses:
        "200":
          description: Created harness (`data` = Harness)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessEnvelope"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/haas/harnesses/{harness_id}:
    parameters:
      - $ref: "#/components/parameters/HarnessId"
    get:
      tags: [HaaS]
      operationId: getHaasHarness
      summary: Get one configured harness
      responses:
        "200":
          description: Harness (`data` = Harness)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [HaaS]
      operationId: updateHarness
      summary: Update a configured harness
      description: The fields `id`, `base`, and `createdAtMs` are immutable.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarnessCreate"
      responses:
        "200":
          description: Updated harness (`data` = Harness)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [HaaS]
      operationId: deleteHarness
      summary: Delete a configured harness
      description: Deleting a harness does not delete historical sessions.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/haas/harnesses/{harness_id}/skills/{skill_id}/files:
    parameters:
      - $ref: "#/components/parameters/HarnessId"
      - $ref: "#/components/parameters/SkillId"
    get:
      tags: [HaaS]
      operationId: listHarnessSkillFiles
      summary: List files in one configured skill bundle
      responses:
        "200":
          description: Skill files (`data` = {id, name, files})
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillFilesEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/haas/models:
    get:
      tags: [HaaS]
      operationId: listModels
      summary: List models by harness backend
      responses:
        "200":
          description: Model catalog (`data` = ModelCatalog)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCatalogEnvelope"
  /v1/haas/sessions:
    get:
      tags: [HaaS]
      operationId: listHaasSessions
      summary: List sessions across users (admin view)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
        - name: app
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Session page (`data` = array of Session, `nextCursor` for pagination)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListEnvelope"
  /v1/haas/sessions/{session_id}/events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [HaaS]
      operationId: streamHaasSessionEvents
      summary: Stream canonical HaaS session events with replay
      parameters:
        - $ref: "#/components/parameters/AfterEventId"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
  /v1/haas/sessions/{session_id}/invocations/{invocation_id}/events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/InvocationId"
    get:
      tags: [HaaS]
      operationId: streamHaasInvocationEvents
      summary: Stream canonical HaaS invocation events with replay
      parameters:
        - $ref: "#/components/parameters/AfterEventId"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
  /v1/haas/sessions/{session_id}/invocations/{invocation_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/InvocationId"
    post:
      tags: [HaaS]
      operationId: cancelInvocation
      summary: Cancel a running invocation (idempotent)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Current invocation state (`data` = Invocation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/haas/sessions/{session_id}/artifacts:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [HaaS]
      operationId: listHaasSessionArtifacts
      summary: List HaaS artifact details for a session
      responses:
        "200":
          description: HaaS artifact list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaasEnvelope"
  /v1/haas/files:
    post:
      tags: [HaaS]
      operationId: uploadFile
      summary: Upload a file for use as task input
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                  default: user_data
      responses:
        "200":
          description: Stored file (`data` = File)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEnvelope"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /v1/haas/sessions/{session_id}/artifacts/archive:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [HaaS]
      operationId: downloadSessionArchive
      summary: Download all session artifacts as an archive
      responses:
        "200":
          description: Artifact archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/haas/files/{file_id}/content:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      tags: [HaaS]
      operationId: downloadFile
      summary: Download one artifact's raw bytes
      responses:
        "200":
          description: File bytes
          headers:
            X-Content-Type-Options:
              required: true
              schema:
                type: string
                const: nosniff
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/haas/files/{file_id}/pdf:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      tags: [HaaS]
      operationId: previewFilePdf
      summary: Render an artifact as PDF when preview support is enabled
      responses:
        "200":
          description: PDF bytes
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "501":
          $ref: "#/components/responses/NotImplemented"
        "502":
          $ref: "#/components/responses/BadGateway"
  /v1/codex-worker/health:
    get:
      tags: [Legacy]
      operationId: legacyHealth
      summary: Legacy health shim
      deprecated: true
      security: []
      responses:
        "200":
          description: Legacy health snapshot
  /v1/codex-worker/ready:
    get:
      tags: [Legacy]
      operationId: legacyReady
      summary: Legacy readiness shim
      deprecated: true
      security: []
      responses:
        "200":
          description: Legacy ready snapshot
  /v1/codex-worker/status:
    get:
      tags: [Legacy]
      operationId: legacyStatus
      summary: Legacy status shim
      deprecated: true
      responses:
        "200":
          description: Legacy status snapshot
  /v1/codex-worker/sessions:
    post:
      tags: [Legacy]
      operationId: legacyCreateSession
      summary: Legacy session create shim mapped to POST /run
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Legacy session/run result
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/codex-worker/sessions/{session_id}/turns:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Legacy]
      operationId: legacyCreateTurn
      summary: Legacy turn shim mapped to POST /run
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Legacy turn result
  /v1/codex-worker/sessions/{session_id}/events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Legacy]
      operationId: legacyStreamEvents
      summary: Legacy event stream shim
      deprecated: true
      responses:
        "200":
          description: Legacy SSE stream
          content:
            text/event-stream:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional idempotency key. Replaying a key returns the first result without restarting the harness.
      schema:
        type: string
        maxLength: 255
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: |
        Optional resume cursor. When set, HaaS resumes the matching invocation's stream
        instead of starting a new turn: it resolves this event id to its invocation
        (must fall within the request's appName/userId/sessionId scope), replays retained
        events after it, then goes live. No new harness turn is started on resume.
      schema:
        type: string
    AfterEventId:
      name: after_event_id
      in: query
      required: false
      schema:
        type: string
    AppName:
      name: app_name
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    InvocationId:
      name: invocation_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^inv_"
    HarnessId:
      name: harness_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^chrn_"
    SkillId:
      name: skill_id
      in: path
      required: true
      schema:
        type: string
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^file_"
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    Unauthorized:
      description: Missing or invalid credential
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    NotFound:
      description: Object not found in caller scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    Conflict:
      description: State conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    UnprocessableEntity:
      description: Semantically invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    RateLimited:
      description: Rate or quota limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    PayloadTooLarge:
      description: Uploaded payload is too large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    BadGateway:
      description: Upstream service failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    NotImplemented:
      description: Capability is not implemented
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
  headers:
    HaaSVersion:
      description: The HaaS native protocol version actually used to serve this response.
      required: true
      schema:
        type: string
        examples: ["2026-08-26"]
  schemas:
    RunRequest:
      type: object
      required: [appName, userId, newMessage]
      properties:
        appName:
          type: string
        userId:
          type: string
        sessionId:
          type: string
        newMessage:
          type: object
          required: [role, parts]
          properties:
            role:
              type: string
              const: user
            parts:
              type: array
              items:
                $ref: "#/components/schemas/Part"
        streaming:
          type: boolean
          default: false
        haas:
          type: object
          additionalProperties: true
      additionalProperties: true
    Part:
      type: object
      properties:
        text:
          type: string
        inlineData:
          type: object
          properties:
            displayName:
              type: string
            mimeType:
              type: string
            data:
              type: string
        fileId:
          type: string
        functionCall:
          type: object
          additionalProperties: true
        functionResponse:
          type: object
          additionalProperties: true
      additionalProperties: true
    Event:
      type: object
      required: [id, invocationId, author, timestamp, content, actions]
      properties:
        id:
          type: string
        invocationId:
          type: string
        author:
          type: string
        timestamp:
          type: number
        content:
          type: object
          required: [role, parts]
          properties:
            role:
              type: string
              enum: [model, user]
            parts:
              type: array
              items:
                $ref: "#/components/schemas/Part"
        actions:
          type: object
          properties:
            stateDelta:
              type: object
              additionalProperties: true
            artifactDelta:
              type: object
              additionalProperties: true
            requestedAuthConfigs:
              type: object
              additionalProperties: true
        longRunningToolIds:
          type: array
          items:
            type: string
        nodeInfo:
          type: [object, "null"]
          additionalProperties: true
        output:
          nullable: true
      additionalProperties: true
    Session:
      type: object
      required: [id, appName, userId, state, events, lastUpdateTime]
      properties:
        id:
          type: string
        appName:
          type: string
        userId:
          type: string
        state:
          type: object
          additionalProperties: true
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        lastUpdateTime:
          type: number
      additionalProperties: true
    Invocation:
      type: object
      required: [id, sessionId, appName, status]
      properties:
        id:
          type: string
          pattern: "^inv_"
        sessionId:
          type: string
        appName:
          type: string
        status:
          type: string
          enum: [running, completed, failed, incomplete, cancelled]
        startedAtMs:
          type: integer
          minimum: 0
        completedAtMs:
          type: [integer, "null"]
        model:
          type: string
        error:
          type: [object, "null"]
          additionalProperties: true
      additionalProperties: true
    SkillFile:
      type: object
      required: [path]
      properties:
        path:
          type: string
        content:
          type: string
        contentB64:
          type: string
      additionalProperties: true
    File:
      type: object
      required: [id, object, filename, bytes]
      properties:
        id:
          type: string
          pattern: "^file_"
        object:
          type: string
          const: file
        sessionId:
          type: string
        invocationId:
          type: string
        filename:
          type: string
        relativePath:
          type: string
        bytes:
          type: integer
          minimum: 0
        mediaType:
          type: string
        sha256:
          type: string
        createdAtMs:
          type: integer
          minimum: 0
      additionalProperties: true
    HarnessCreate:
      type: object
      required: [base]
      properties:
        name:
          type: string
        base:
          type: string
        defaultModel:
          type: string
        systemPrompt:
          type: string
        mcpServers:
          type: array
          items:
            type: object
            additionalProperties: true
        skills:
          type: array
          items:
            type: object
            additionalProperties: true
        disabledTools:
          type: array
          items:
            type: string
        provider:
          type: object
          additionalProperties: true
        maxStep:
          type: [integer, "null"]
        timeoutSeconds:
          type: [integer, "null"]
      additionalProperties: true
    Harness:
      type: object
      required: [id, object, name, base, createdAtMs]
      properties:
        id:
          type: string
        object:
          type: string
          const: harness
        name:
          type: string
        base:
          type: string
        baseLabel:
          type: string
        defaultModel:
          type: string
        systemPrompt:
          type: string
        mcpServers:
          type: array
          items:
            type: object
            additionalProperties: true
        skills:
          type: array
          items:
            type: object
            additionalProperties: true
        disabledTools:
          type: array
          items:
            type: string
        provider:
          type: object
          additionalProperties: true
        maxStep:
          type: [integer, "null"]
        timeoutSeconds:
          type: [integer, "null"]
        adapterCapabilities:
          type: object
          additionalProperties: true
        createdAtMs:
          type: integer
          minimum: 0
        updatedAtMs:
          type: integer
          minimum: 0
      additionalProperties: true
    ModelCatalog:
      type: object
      required: [backends]
      properties:
        backends:
          type: object
          additionalProperties:
            type: object
            required: [default, models]
            properties:
              default:
                type: string
              models:
                type: array
                items:
                  type: object
                  additionalProperties: true
    HaasEnvelope:
      type: object
      required: [data, traceId]
      description: |
        HaaS native response envelope. `data` carries the resource (object or array).
        Paginated list responses additionally include `nextCursor` (null when exhausted).
        Additional optional fields may be added within a protocol version.
      properties:
        data: {}
        nextCursor:
          type: [string, "null"]
        traceId:
          type: string
    HarnessEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/Harness"
    HarnessListEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [harnesses]
              properties:
                harnesses:
                  type: array
                  items:
                    $ref: "#/components/schemas/Harness"
    FileEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/File"
    InvocationEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/Invocation"
    ModelCatalogEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ModelCatalog"
    SkillFilesEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [id, name, files]
              properties:
                id:
                  type: string
                name:
                  type: string
                files:
                  type: array
                  items:
                    $ref: "#/components/schemas/SkillFile"
    SessionListEnvelope:
      allOf:
        - $ref: "#/components/schemas/HaasEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Session"
    ErrorDetail:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
        haasError:
          type: object
          required: [type, code]
          properties:
            type:
              type: string
            code:
              enum:
                - missing_credential
                - invalid_credential
                - app_not_found
                - haas_harness_not_found
                - session_not_found
                - haas_invocation_not_found
                - haas_file_not_found
                - invalid_input
                - haas_legacy_request_invalid
                - haas_unsupported_base
                - haas_tool_schema_unsupported
                - session_busy
                - session_expired
                - haas_offset_expired
                - haas_cancel_unsupported
                - haas_policy_denied
                - haas_policy_invalid
                - haas_policy_unsupported
                - haas_url_not_allowed
                - haas_secret_input_invalid
                - haas_provider_source_invalid
                - haas_mcp_source_invalid
                - haas_adapter_unavailable
                - haas_adapter_incompatible
                - haas_adapter_overloaded
                - haas_adapter_error
                - haas_model_unavailable
                - haas_provider_error
                - haas_provider_timeout
                - haas_mcp_unavailable
                - haas_sandbox_widening_rejected
                - haas_vault_unavailable
                - haas_request_timeout
                - haas_rate_limited
                - haas_quota_exceeded
                - haas_queue_full
                - haas_queue_timeout
                - haas_store_unavailable
                - haas_idempotency_store_unavailable
                - haas_idempotency_conflict
                - haas_identity_unavailable
                - haas_file_too_large
                - haas_preview_unavailable
                - haas_archive_failed
              type: string
            param:
              type: [string, "null"]
            safeReason:
              type: string
            retryable:
              type: boolean
            traceId:
              type: string
          additionalProperties: true
      additionalProperties: true
